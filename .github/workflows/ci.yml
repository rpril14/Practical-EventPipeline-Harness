name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EventPipeline.sln

      - name: Build
        run: dotnet build EventPipeline.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test EventPipeline.sln --no-build --configuration Release --logger "console;verbosity=normal"
